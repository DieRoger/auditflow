[project]
name = "auditflow"
version = "0.1.0"
description = "AI-Native Enterprise Audit Intelligence Platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "redis>=5.2.0",
    "celery>=5.4.0",
    "httpx>=0.28.0",
    "openai>=1.55.0",
    "structlog>=24.4.0",
    "python-dotenv>=1.0.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "minio>=7.2.0",
    "langgraph>=0.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]
embedding = [
    "sentence-transformers>=3.2.0",
]
ocr = [
    "pymupdf>=1.25.0",
    "pdfplumber>=0.11.0",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "ARG"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true

[tool.bandit]
skips = ["B101", "B311", "B403", "B404", "B603"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
